<!DOCTYPE html>
<html lang="en">
<head>

      </div>
            <div class="grid-2 reveal">
        <div class="card"><h3 class="mb-2">General Settings</h3><form id="settings-form">
          <div class="form-group"><label>Currency</label><select class="form-control" name="currency"><option value="USD">USD ($)</option><option value="EUR">EUR (â‚¬)</option><option value="GBP">GBP (Â£)</option><option value="INR">INR (â‚¹)</option><option value="JPY">JPY (Â¥)</option></select></div>
          <div class="form-group"><label>Monthly Budget</label><input class="form-control" name="monthlyBudget" type="number" step="100"></div>

      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>

</html>
